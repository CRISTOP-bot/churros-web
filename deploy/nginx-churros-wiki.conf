# Add the upstream and public locations to the existing HTTPS vhost.
# Keep the internal MediaWiki vhost bound to loopback.

upstream churros_wiki_api {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 127.0.0.1:8081;
    server_name mediawiki.internal;
    root /usr/share/webapps/mediawiki;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php(?:/|$) {
        include fastcgi_params;
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php-fpm/php-fpm.sock;
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}

# Paste these locations inside the existing public HTTPS server block for
# www.churroslinux.org. TLS certificate directives remain owned by that vhost.

location ^~ /api/wiki/ {
    client_max_body_size 220k;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_pass http://churros_wiki_api;
}

# The Action API is intentionally not public; browser reads/writes go through
# the ChurrOS BFF. OAuth and login pages remain public for per-user consent.
location = /wiki-engine/api.php { return 404; }
location = /wiki-engine/rest.php { return 404; }

location ^~ /wiki-engine/rest.php/oauth2/ {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:8081/rest.php/oauth2/;
}

location = /wiki-engine/index.php {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:8081/index.php$is_args$args;
}

location = /wiki-engine/load.php {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:8081/load.php$is_args$args;
    expires 7d;
}

location ^~ /wiki-engine/ { return 404; }

location ^~ /wiki-assets/ {
    alias /var/lib/mediawiki/uploads/;
    try_files $uri =404;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    expires 7d;
}

# Apply these headers in the public HTTPS server block (adjust if the existing
# site already has a stricter policy).
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
